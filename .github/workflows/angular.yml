name: Angular Tests & Coverage Check

on: push

jobs:
  test:
    name: Run Tests & Check Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage

      - name: Check Coverage Threshold
        run: |
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "❌ Le fichier de couverture n'a pas été généré"
            exit 1
          fi

          COVERAGE=$(node -pe "require('./coverage/coverage-summary.json').total.statements.pct")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "❌ La couverture est inférieure à 80% ($COVERAGE%)"
            exit 1
          else
            echo "✅ La couverture est suffisante ($COVERAGE%)"
          fi
  lint:
    name: Run Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint Check
        run: npm run lint

      - name: Fail on Lint Errors
        run: |
          if [ -f "dist/lint-errors.txt" ]; then
            echo "❌ Il y a des erreurs de lint. Veuillez les corriger."
            exit 1
          else
            echo "✅ Aucun problème de lint détecté."
          fi
