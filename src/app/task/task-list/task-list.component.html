<div class="filter-container">
  <form [formGroup]="taskFilterForm">
    <label for="filter">Filtrer par statut :</label>
    <select formControlName="filter" id="filter" (ngModelChange)="onFilterChange()">
      <option value="all">Toutes les tâches</option>
      <option value="status">Tâches incomplètes</option>
    </select>
  </form>
</div>

<p-table *ngIf="tasksArray?.controls" [value]="tasksArray.controls" class="tasks-table">
  <ng-template pTemplate="header">
    <tr>
      <th>✅ Statut</th>
      <th>📋 Tâche</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-task let-index="rowIndex">
    <tr [formGroup]="task">
      <td>
        <p-checkbox [binary]="true" formControlName="complete" (onChange)="toggleTaskStatus(index)"></p-checkbox>
      </td>
      <td [ngClass]="{ completed: task.get('complete')?.value }">
        {{ task.get('label')?.value }}
      </td>
    </tr>
  </ng-template>
</p-table>
