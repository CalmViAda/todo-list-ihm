<div class="filter-container">
  <form [formGroup]="taskFilterForm">
    <label id="filter">{{ 'task_list_filter.filter_by_status' | translate }}: </label>
    <p-select
      formControlName="filter"
      [options]="filters"
      [ariaLabel]="'task_list_filter.filter_by_status' | translate"
      [placeholder]="'task_list_filter.select_placeholder' | translate"
      (ngModelChange)="onSelectedFilter()"
    />
  </form>
</div>
